seed_everything: 1

trainer:
  accelerator: cpu
  devices: 1
  strategy: auto
  max_epochs: 1          # one pass to accumulate all training windows
  limit_train_batches: 1
  default_root_dir: ./results
  use_distributed_sampler: false
  log_every_n_steps: 1
  num_sanity_val_steps: 0     # Very important. Without it lightning runs a few validation runs before training and the code breaks.

model:
  forecaster:
    class_path: our_models.tsfresh_bayesian_ridge.TsfreshBayesianRidge
    init_args:
      n_samples: 100
      fdr_level: 0.001
      use_tsfresh_selection: false
      sklearn_state_path: ./src/exps/tsfresh_bayesian_ridge/sklearn_state
  learning_rate: 0.001     # no gradient updates; optimizer is a no-op
  num_samples: 100

data:
  data_manager:
    class_path: probts.data.data_manager.DataManager
    init_args:
      context_length: 96
      split_val: true
      scaler: standard
  batch_size: 500
  test_batch_size: 32
  num_workers: 1