# lightning==2.3.0.dev0
seed_everything: 1
trainer:
  accelerator: cpu
  devices: 1
  strategy: auto
  max_epochs: 30
  use_distributed_sampler: false
  limit_train_batches: 100
  log_every_n_steps: 1
  default_root_dir: ./results
model:
  forecaster:
    class_path: our_models.bayesian_linear.BayesianLinearForecaster
    init_args:
      individual: false
      use_lags: true
      kl_weight: 0.2
      init_sigma: -3
      n_train_batches: 100
  num_samples: 100
  learning_rate: 0.001
  quantiles_num: 20
data:
  data_manager:
    class_path: probts.data.data_manager.DataManager
    init_args:
      dataset: solar_nips
      context_length: 96        # required for long-term datasets
      prediction_length: 96     # required for long-term datasets
      split_val: true
      scaler: standard # identity, standard, temporal
  batch_size: 64
  test_batch_size: 64
  num_workers: 8
